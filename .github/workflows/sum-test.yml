# Runs the Arcana sum-rule test when research/sum_test.py or the predictions change; saves the report in research/.
name: Sum rule test
on:
  push:
    branches: [main]
    paths: [research/sum_test.py, research/sum_pred.json, .github/workflows/sum-test.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Reuse downloaded candles
        uses: actions/cache@v4
        with:
          path: cache
          key: dukas-${{ github.run_id }}
          restore-keys: dukas-
      - name: Run the test
        run: python3 research/sum_test.py
      - name: Save the report in research/
        if: always()
        run: |
          cp out/sum_test.md out/sum_test.json research/ || exit 0
          git config user.name "research-bot"; git config user.email "research-bot@users.noreply.github.com"
          git add research/sum_test.md research/sum_test.json
          git commit -m "Sum rule test report $(date -u +%F)" && git pull -q --rebase origin main && git push origin HEAD:main
