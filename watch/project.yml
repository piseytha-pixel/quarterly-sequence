name: ArcanaWatch
options:
  bundleIdPrefix: com.quartersequence.arcana
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  ArcanaWatch:
    type: application
    platform: watchOS
    sources: [Shared, App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quartersequence.arcana.watch
        PRODUCT_NAME: Arcana
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Arcana
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - target: ArcanaWidgets
    scheme: {}
  ArcanaWidgets:
    type: app-extension
    platform: watchOS
    sources: [Shared, Widgets]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Arcana
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quartersequence.arcana.watch.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
